<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الكاتب الشامل - تصميم محمد علي أحمد الحطاب الجبوري</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { margin: 0; padding: 15px; background: #eef2f5; color: #2d3748; }
        .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        
        /* الهيدر وشعار التصميم */
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #edf2f7; padding-bottom: 15px; }
        .header h1 { color: #1a202c; font-size: 26px; margin: 0 0 6px 0; }
        .designer-tag { font-size: 14px; color: #4a5568; font-weight: 600; background: #edf2f7; display: inline-block; padding: 4px 14px; border-radius: 20px; }

        /* أزرار الخانات/الأقسام */
        .tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 20px; }
        .tab-btn { padding: 12px 8px; border: 1px solid #cbd5e0; background: #f7fafc; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.2s; text-align: center; }
        .tab-btn.active { background: #3182ce; color: white; border-color: #3182ce; box-shadow: 0 2px 6px rgba(49,130,206,0.3); }

        /* منطقة الإضافة والتحرير */
        .editor-box { background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 25px; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 15px; border: 1px solid #cbd5e0; border-radius: 6px; margin-bottom: 10px; }
        textarea { width: 100%; height: 260px; padding: 12px; font-size: 15px; border: 1px solid #cbd5e0; border-radius: 6px; resize: vertical; line-height: 1.7; }
        
        .action-row { display: flex; gap: 10px; margin-top: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .btn-main { padding: 10px 20px; background: #38a169; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-clear { padding: 10px 15px; background: #e2e8f0; color: #4a5568; border: none; border-radius: 6px; cursor: pointer; }
        
        /* قائمة النصوص المحفوظة */
        .notes-list { display: flex; flex-direction: column; gap: 12px; }
        .note-card { background: #ffffff; border: 1px solid #e2e8f0; border-right: 5px solid #3182ce; border-radius: 8px; padding: 15px; }
        .note-card h3 { margin: 0 0 8px 0; font-size: 17px; color: #2b6cb0; }
        .note-card p { white-space: pre-wrap; font-size: 15px; color: #4a5568; margin: 0 0 12px 0; line-height: 1.6; max-height: 200px; overflow-y: auto; background: #fafafa; padding: 10px; border-radius: 6px; }
        
        /* أزرار التحكم بالنص (نسخ، تعديل، محو) */
        .card-controls { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action { padding: 6px 12px; border: none; border-radius: 5px; font-size: 13px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .btn-copy { background: #edf2f7; color: #2d3748; border: 1px solid #cbd5e0; }
        .btn-edit { background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; }
        .btn-delete { background: #fff5f5; color: #c53030; border: 1px solid #fed7d7; }

        .toast { font-size: 13px; color: #38a169; font-weight: bold; }
        
        /* التذييل السفلي */
        footer { text-align: center; margin-top: 30px; padding-top: 15px; border-top: 1px solid #edf2f7; font-size: 13px; color: #718096; }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر مع التوثيق -->
        <div class="header">
            <h1>تطبيق الكاتب الشخصي</h1>
            <div class="designer-tag">تصميم: محمد علي أحمد الحطاب الجبوري</div>
        </div>

        <!-- الخانات الأربع -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchCategory('novels', this)">📚 الروايات</button>
            <button class="tab-btn" onclick="switchCategory('stories', this)">📖 القصص</button>
            <button class="tab-btn" onclick="switchCategory('articles', this)">📰 المقالات</button>
            <button class="tab-btn" onclick="switchCategory('random', this)">✍️ كتابات عشوائية</button>
        </div>

        <!-- خانة الإضافة والتعديل واللصق -->
        <div class="editor-box">
            <input type="text" id="noteTitle" placeholder="عنوان الموضوع / الفصل...">
            <textarea id="noteContent" placeholder="اكتب هنا، أو الصق نصاً تم نسخُه من مكان آخر..."></textarea>
            <div class="action-row">
                <button class="btn-main" onclick="saveNote()">➕ إضافة / حفظ النص</button>
                <button class="btn-clear" onclick="clearForm()">تفريغ الخانة</button>
                <span id="statusToast" class="toast"></span>
            </div>
        </div>

        <!-- قائمة المحفوظات -->
        <div>
            <h2 id="sectionTitle" style="font-size: 18px;">المحفوظات في قسم الروايات</h2>
            <div id="notesContainer" class="notes-list"></div>
        </div>

        <!-- حقوق الحفظ والتصميم -->
        <footer>
            جميع الحقوق محفوظة &copy; تطبيق الكاتب | تصميم: <strong>محمد علي أحمد الحطاب الجبوري</strong>
        </footer>
    </div>

    <script>
        let currentCat = 'novels';
        let editId = null;

        const catLabels = {
            novels: 'الروايات',
            stories: 'القصص',
            articles: 'المقالات',
            random: 'الكتابات العشوائية'
        };

        function switchCategory(category, btn) {
            currentCat = category;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('sectionTitle').innerText = `المحفوظات في قسم ${catLabels[category]}`;
            clearForm();
            renderNotes();
        }

        function getSavedNotes() {
            return JSON.parse(localStorage.getItem('writer_app_data') || '[]');
        }

        function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();

            if (!title || !content) {
                alert('يرجى كتابة العنوان والمحتوى قبل الحفظ.');
                return;
            }

            let notes = getSavedNotes();

            if (editId !== null) {
                notes = notes.map(n => n.id === editId ? { ...n, title, content } : n);
                editId = null;
                showToast('تم تعديل النص بنجاح!');
            } else {
                notes.push({
                    id: Date.now(),
                    category: currentCat,
                    title: title,
                    content: content
                });
                showToast('تم إضافة النص بنجاح!');
            }

            localStorage.setItem('writer_app_data', JSON.stringify(notes));
            clearForm();
            renderNotes();
        }

        function renderNotes() {
            const notes = getSavedNotes().filter(n => n.category === currentCat);
            const container = document.getElementById('notesContainer');
            container.innerHTML = '';

            if (notes.length === 0) {
                container.innerHTML = `<p style="color:#718096; text-align:center; padding: 20px;">لا توجد نصوص محفوظة في قسم ${catLabels[currentCat]} بعد.</p>`;
                return;
            }

            notes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `
                    <h3>${note.title}</h3>
                    <p id="content-${note.id}">${escapeHtml(note.content)}</p>
                    <div class="card-controls">
                        <button class="btn-action btn-copy" onclick="copyText(${note.id})">📋 نسخ النص</button>
                        <button class="btn-action btn-edit" onclick="editNote(${note.id})">✏️ تعديل / إكمال</button>
                        <button class="btn-action btn-delete" onclick="deleteNote(${note.id})">🗑️ محو (حذف)</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function copyText(id) {
            const note = getSavedNotes().find(n => n.id === id);
            if (note) {
                navigator.clipboard.writeText(note.content).then(() => {
                    showToast('تم نسخ النص إلى الحافظة!');
                }).catch(() => {
                    alert('تعذر النسخ التلقائي، يمكنك نسخه يدوياً.');
                });
            }
        }

        function editNote(id) {
            const note = getSavedNotes().find(n => n.id === id);
            if (note) {
                document.getElementById('noteTitle').value = note.title;
                document.getElementById('noteContent').value = note.content;
                editId = id;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function deleteNote(id) {
            if (confirm('هل أنت تأكد من محو (حذف) هذا النص؟')) {
                let notes = getSavedNotes().filter(n => n.id !== id);
                localStorage.setItem('writer_app_data', JSON.stringify(notes));
                renderNotes();
                showToast('تم محو النص.');
            }
        }

        function clearForm() {
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            editId = null;
        }

        function showToast(msg) {
            const toast = document.getElementById('statusToast');
            toast.innerText = msg;
            setTimeout(() => toast.innerText = '', 3000);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        renderNotes();
    </script>
</body>
</html>
